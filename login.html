<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-container {
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #f9f9f9;
    }
    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .login-container .fg {
      margin-bottom: 15px;
    }
    .login-container label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .login-container input[type="text"],
    .login-container input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #c8cad4;
      border-radius: 5px;
      box-sizing: border-box;
    }
    .login-container button {
      width: 100%;
      padding: 10px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .login-container button:hover {
      background: #1565c0;
    }
  </style>
</head>
<body>
   <nav>
        <a href="index.html">Cubicle</a>
        <a href="locker.html">Locker</a>
        <a href="calculate.html">Partition</a>
        <a href="login.html" aria-current="page">Login</a>
        <div class="font-controls" aria-label="Font size controls">
          <button type="button" class="font-btn" onclick="changeFontSize(1)" title="Increase font size">A+</button>
          <button type="button" class="font-btn" onclick="changeFontSize(-1)" title="Decrease font size">A-</button>
        </div>
    </nav>
  <div class="wrap">
    <div class="login-container">
      <h2>Login</h2>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="fg">
          <label for="email">Email</label>
          <input type="text" id="email" name="email" required>
        </div>
        <div class="fg">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Log In</button>
        <div class="err" id="loginMsg" style="margin-top:10px; padding:8px; display:none; text-align:center;"></div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"> </script>
  <script src="main.js"></script>
  <script>
 async function handleLogin(event) {
  event.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const messageBox = document.getElementById('loginMsg');

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      messageBox.textContent = error.message;
      messageBox.style.display = 'block';
      messageBox.style.color = '#b00020';
    } else {
      // Store session token automatically handled by Supabase
      localStorage.setItem('authToken', data.session.access_token);
      window.location.href = 'index.html';
    }
  } catch (err) {
    messageBox.textContent = 'Network error: ' + err.message;
    messageBox.style.display = 'block';
    messageBox.style.color = '#b00020';
  }
}
</script>
   
</body>
</html>
