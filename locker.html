<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"> </script>

    <style> 
        .summary { 
            float: right; 
            border: solid 2px;
            height: 400px;
            width: 500px;
            background: #fff;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .sheet-result{margin-top:12px;}
        .sheet-card{border-top:1px solid #ccc; padding-top:8px; margin-top:10px;}
        .sheet-card h4{margin:0 0 4px;}
        .sheet-canvas{border:1px solid #333; background:#fff; margin:6px 0; width:100%; max-width:360px; height:auto;}
    </style>
    <nav>
        <a href="index.html">Cubicle</a>
        <a href="locker.html" aria-current="page">Locker</a>
        <a href="calculate.html">Partition</a>
        <a href="login.html">login</a>
        <div class="font-controls" aria-label="Font size controls">
            <button type="button" class="font-btn" onclick="changeFontSize(1)" title="Increase font size">A+</button>
            <button type="button" class="font-btn" onclick="changeFontSize(-1)" title="Decrease font size">A-</button>
        </div>
    </nav>
    <form>
        <h3>Locker Configuration</h3>
        <table>
            <tr>
              <td><label for="lh">Height:</label></td>
                <td><input type="number" id="lh" value="1800" min="1000"></td>
            </tr>
            <tr>
                <td><label for="skirting">Skirting (mm):</label></td>
                <td><input type="number" id="skirting" value="60" min="0"></td>
            </tr>
            <tr>
                <td><label for="lw">Width:</label></td>
                <td><input type="number" id="lw" value="1800" min="50"></td>
            </tr>
            <tr>
                <td><label for="lc">Columns:</label></td>
                <td><input type="number" id="lc" value="4" min="1"></td>
            </tr>
            <tr>
                <td><label for="zshape">Z-shape:</label></td>
                <td>
                    <input type="checkbox" id="zshape"> 
                    <label for="zcol">for col (0=All):</label>
                    <input type="number" id="zcol" value="1" min="0" style="width:40px">
                </td>
            </tr>
            <tr>
                <td><label for="lr">Module:</label></td>
                <td>
                    <select name="lr" id="lr">
                        <option value="1">A1</option>
                        <option value="2">A2</option>
                        <option value="3">A3</option>
                        <option value="4">A4</option>
                        <option value="5">A5</option>
                        <option value="6">A6</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="customColumns">Custom columns:</label></td>
                <td>
                    <input type="text" id="customColumns" placeholder="Example: 2,3" style="width:110px">
                    <span style="font-size: calc(12px * var(--font-scale));">lockers per column</span>
                </td>
            </tr>
            <tr>
                <td colspan="2" style="padding-top: 10px;">
                    <button type="button" onclick="calculate()">Calculate</button>
                </td>
            </tr>
            <tr>
                <td>Color:</td><td>
                  <div id="color"></div>
                  <div id="selectedShadeName" style="font-size:11px;color:#555;margin-top:4px;font-weight:bold;"></div>
                </td></tr>
        </table>
    </form>
    <table><tr><td>
    <canvas id="cv" width="500" height="400">    </canvas>

    </td>
    <td><div class="summary">
       <button type="button" onclick="exportExcel();">Download</button>
       <table style="width: 100%; border-collapse: collapse; text-align: left;">
           <thead>
               <tr style="background: #f1f1f1;">
                   <th style="border: 1px solid #ccc; padding: 6px;">Item</th>
                   <th style="border: 1px solid #ccc; padding: 6px;">Qty</th>
                   <th style="border: 1px solid #ccc; padding: 6px;">Dimension (W x H)</th>
                   <th style="border: 1px solid #ccc; padding: 6px;">Thickness</th>
               </tr>
           </thead>
           <tbody id="summaryTable">
           </tbody>
       </table>
       <div id="sheetResult" class="sheet-result"></div>
    </div></td></tr></table>
    </div>
    <script src="main.js"></script>
    <script>
   
        

         const sheets9mm = [
        { name: "12 x 6 feet", width: 3670, height: 1860 },
        { name: "14 x 6 feet", width: 4300, height: 1860 },
        { name: "8 x 4 feet", width: 2438, height: 1219 }
      ];
       const sheets3mm = [
        { name: "12 x 6 feet", width: 3670, height: 1860 },
        { name: "8 x 4 feet", width: 2438, height: 1219 },
        { name: "14 x 6 feet", width: 4300, height: 1860 }
      ];
        let currentColor = '#e9ecef';
        let lockerColors = {};

        function color() {
            let shade = document.getElementById('color');
            shade.style.display = 'flex';
            shade.style.flexWrap = 'wrap';
            shade.style.gap = '4px';
            
            solids.forEach((solid, index) => {
                let swatch = document.createElement('div');
                swatch.style.width = '24px';
                swatch.style.height = '24px';
                swatch.style.backgroundColor = solid.color;
                swatch.style.border = '1px solid #ccc';
                swatch.style.borderRadius = '3px';
                swatch.title = solid.name;
                swatch.style.cursor = 'pointer';

                if (index === 0) {
                    currentColor = solid.color;
                    swatch.style.outline = '2px solid #333';
                    swatch.style.transform = 'scale(1.1)';
                    // Show initial shade name
                    setTimeout(function() {
                        var lbl = document.getElementById('selectedShadeName');
                        if (lbl) lbl.textContent = 'Selected: ' + solid.name;
                    }, 0);
                }

                swatch.onclick = () => {
                    Array.from(shade.querySelectorAll('.shade-swatch')).forEach(child => {
                        child.style.outline = 'none';
                        child.style.transform = 'scale(1)';
                    });
                    swatch.style.outline = '2px solid #333';
                    swatch.style.transform = 'scale(1.1)';
                    currentColor = solid.color;
                    var lbl = document.getElementById('selectedShadeName');
                    if (lbl) lbl.textContent = 'Selected: ' + solid.name;
                };
                swatch.className = 'shade-swatch';
                shade.appendChild(swatch);
            });
        }


        function calculate() {
            var lh = parseFloat(document.getElementById('lh').value);
            var lw = parseFloat(document.getElementById('lw').value);
            var lc = parseInt(document.getElementById('lc').value);
            var lr = parseInt(document.getElementById('lr').value);
            var customColumns = getCustomColumns();
            var skirting = parseFloat(document.getElementById('skirting').value) || 0;
            var zshape = document.getElementById('zshape') ? document.getElementById('zshape').checked : false;
            var zcol = document.getElementById('zcol') ? parseInt(document.getElementById('zcol').value) : 1;
            
            var cv = document.getElementById('cv');
            var ctx = cv.getContext('2d');
            ctx.clearRect(0, 0, cv.width, cv.height);
            
            if (lh > 0 && lw > 0 && lc > 0 && lr > 0) {
                var lockerH = Math.max(0, lh - skirting);
                var colCount = customColumns.length > 0 ? customColumns.length : lc;
                var rw = lw / colCount;
                var rh = lockerH / lr;

                // Calculate scale and padding to fit drawing into the canvas
                var padding = 50;
                var scale = Math.min((cv.width - padding * 2) / lw, (cv.height - padding * 2) / lh);

                var startX = (cv.width - (lw * scale)) / 2;
                var startY = (cv.height - (lh * scale)) / 2;

                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;

                if (customColumns.length > 0) {
                    for (var c = 0; c < customColumns.length; c++) {
                        var columnRows = customColumns[c];
                        var customRh = lockerH / columnRows;
                        var x = startX + c * rw * scale;
                        var w = rw * scale;

                        if (zshape && (zcol === 0 || c === zcol - 1)) {
                            drawZDoor(ctx, x, startY, w, lockerH * scale, scale, lockerColors['custom-' + c + '-0'] || '#e9ecef', lockerColors['custom-' + c + '-1'] || '#e9ecef');
                        } else {
                            for (var r = 0; r < columnRows; r++) {
                                var rowY = startY + r * customRh * scale;
                                var h = customRh * scale;
                                drawNormalDoor(ctx, x, rowY, w, h, scale, lockerColors['custom-' + c + '-' + r] || '#e9ecef');
                            }
                        }
                    }
                } else {
                    for (var c = 0; c < lc; c++) {
                        var x = startX + c * rw * scale;
                        var w = rw * scale;
                        var fullH = lockerH * scale;

                        if (zshape && (zcol === 0 || c === zcol - 1)) {
                        drawZDoor(ctx, x, startY, w, fullH, scale, lockerColors[c + '-0'] || '#e9ecef', lockerColors[c + '-1'] || '#e9ecef');
                        } else {
                        // Draw multiple rows for this column
                        for (var r = 0; r < lr; r++) {
                            var rowY = startY + r * rh * scale;
                            var h = rh * scale;

                            drawNormalDoor(ctx, x, rowY, w, h, scale, lockerColors[c + '-' + r] || '#e9ecef');
                        }
                        }
                    }
                }
                
                // Draw skirting
                if (skirting > 0) {
                    ctx.fillStyle = '#4a4e4a';
                    ctx.fillRect(startX, startY + lockerH * scale, lw * scale, skirting * scale);
                    ctx.strokeRect(startX, startY + lockerH * scale, lw * scale, skirting * scale);
                }

                var depth = 450;
                ctx.fillStyle = '#333';
                ctx.font = '14px Roboto, sans-serif';
                ctx.fillText('Overall dimension: ' + lw + 'W x ' + lh + 'H', startX, startY + (lh * scale) + 25);
                if (customColumns.length > 0) {
                    ctx.fillText('Custom columns: ' + customColumns.join(', ') + ' lockers | Col W ' + rw.toFixed(1), startX, startY + (lh * scale) + 45);
                } else {
                    ctx.fillText('Locker dimension: ' + 
                    rw.toFixed(1) + 'W x ' + rh.toFixed(1) + 
                    'H x ' + depth + ' Depth', startX, startY + (lh * scale) + 45);
                }

                // Generate Summary
                var topQty = 1;
                var bottomQty = 1;
                var sidesQty = 2;
                var backboardQty = 1;
                var dividerQty = colCount - 1;
                
                var shelfQty = 0;
                var normalDoorsQty = 0;
                var zDoorsQty = 0;
                
                if (customColumns.length > 0) {
                    for (var c = 0; c < customColumns.length; c++) {
                        var isCustomZ = zshape && (zcol === 0 || c === zcol - 1);
                        if (isCustomZ) {
                            zDoorsQty += 2;
                            shelfQty += 2;
                        } else {
                            normalDoorsQty += customColumns[c];
                            shelfQty += Math.max(0, customColumns[c] - 1);
                        }
                    }
                } else {
                    for (var c = 0; c < lc; c++) {
                        var isZ = zshape && (zcol === 0 || c === zcol - 1);
                        if (isZ) {
                            zDoorsQty += 2;
                            shelfQty += 2;
                        } else {
                            shelfQty += Math.max(0, lr - 1);
                            normalDoorsQty += lr;
                        }
                    }
                }
                
                var totalDoors = normalDoorsQty + zDoorsQty;
                var summaryHtml = '';
                var panelParts = [];
                
                function addSummaryRow(item, qty, dim, thickness, partW, partH) {
                    if (qty > 0) {
                        summaryHtml += '<tr>';
                        summaryHtml += '<td style="border: 1px solid #ccc; padding: 6px;">' + item + '</td>';
                        summaryHtml += '<td style="border: 1px solid #ccc; padding: 6px;">' + qty + '</td>';
                        summaryHtml += '<td style="border: 1px solid #ccc; padding: 6px;">' + dim + '</td>';
                        summaryHtml += '<td style="border: 1px solid #ccc; padding: 6px;">' + (thickness || '-') + '</td>';
                        summaryHtml += '</tr>';
                        if (thickness && partW > 0 && partH > 0) {
                            for (var i = 0; i < qty; i++) {
                                panelParts.push({
                                    label: item,
                                    w: partW,
                                    h: partH,
                                    thickness: thickness
                                });
                            }
                        }
                    }
                }
                
                addSummaryRow('Top', topQty, lw.toFixed(1) + ' x ' + depth, '9 mm', lw, depth);
                addSummaryRow('Bottom', bottomQty, lw.toFixed(1) + ' x ' + depth, '9 mm', lw, depth);
                addSummaryRow('Sides', sidesQty, depth + ' x ' + lh.toFixed(1), '3 mm', depth, lh);
                addSummaryRow('Backboard', backboardQty, lw + ' x ' + (lh - skirting), '3 mm', lw, lh - skirting);
                addSummaryRow('Divider', dividerQty, depth + ' x ' + lockerH.toFixed(1), '3 mm', depth, lockerH);
                addSummaryRow('Shelf', shelfQty, rw.toFixed(1) + ' x ' + depth, '9 mm', rw, depth);
                if (customColumns.length > 0) {
                    var customDoorGroups = {};
                    customColumns.forEach(function(rows, c) {
                        if (zshape && (zcol === 0 || c === zcol - 1)) return;

                        var doorH = (lockerH / rows).toFixed(1);
                        var key = rw.toFixed(1) + ' x ' + doorH;
                        customDoorGroups[key] = (customDoorGroups[key] || 0) + rows;
                    });
                    Object.keys(customDoorGroups).forEach(function(dim) {
                        var parts = dim.split(' x ');
                        addSummaryRow('Shutter', customDoorGroups[dim], dim, '9 mm', parseFloat(parts[0]), parseFloat(parts[1]));
                    });
                } else if (normalDoorsQty > 0) {
                    addSummaryRow('Shutter', normalDoorsQty, rw.toFixed(1) + ' x ' + rh.toFixed(1), '9 mm', rw, rh);
                }
                if (zDoorsQty > 0) addSummaryRow('Z-Shutter', zDoorsQty, rw.toFixed(1) + ' x ' + (lockerH * 0.65).toFixed(1), '9 mm', rw, lockerH * 0.65);
                addSummaryRow('Lock', totalDoors, '-');
                addSummaryRow('Hinges', totalDoors * 2, '-');
                addSummaryRow('front-channel', (colCount + 1), '-');
                addSummaryRow('back-channel', (colCount + 1), '-');
                addSummaryRow('Half-round', (colCount +1)*4, '-');
                
                var summaryTable = document.getElementById('summaryTable');
                if (summaryTable) summaryTable.innerHTML = summaryHtml;
                drawRequiredSheets(panelParts);
            }
        }
        function getCustomColumns() {
            var input = document.getElementById('customColumns');
            if (!input || input.value.trim() === '') return [];

            return input.value.split(',')
                .map(function(value) { return parseInt(value.trim()); })
                .filter(function(value) { return value > 0; });
        }

        function getShadeNameByColor(hex) {
            if (typeof solids === 'undefined') return '';
            var found = solids.find(function(s) { return s.color.toLowerCase() === hex.toLowerCase(); });
            return found ? found.name : '';
        }

        function drawNormalDoor(ctx, x, y, w, h, scale, fillColor) {
            ctx.fillStyle = fillColor || '#e9ecef';
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#333';
            ctx.strokeRect(x, y, w, h);
            // Show shade name inside the locker cell
            var sName = getShadeNameByColor(fillColor);
            if (sName && w > 28 && h > 16) {
                ctx.save();
                ctx.font = 'bold 9px monospace';
                ctx.fillStyle = '#1c1c2e';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(sName, x + w / 2, y + 3);
                ctx.restore();
            }

            var inset = Math.max(2, 5 * scale);
            ctx.strokeRect(x + inset, y + inset, w - inset * 2, h - inset * 2);

            var knobX = x + inset + Math.max(6, 15 * scale);
            var knobY = y + h / 2;
            var knobR = Math.max(3, 4 * scale);
            ctx.beginPath();
            ctx.fillStyle = '#555';
            ctx.arc(knobX, knobY, knobR, 0, Math.PI * 2);
            ctx.fill();

            var ventW = Math.min(w / 3, 30 * scale);
            var ventX = x + w / 2 - ventW / 2;
            var ventY = y + inset + Math.max(5, 15 * scale);
            ctx.lineWidth = 1;
            for (var v = 0; v < 4; v++) {
                ctx.beginPath();
                ctx.moveTo(ventX, ventY + (v * Math.max(3, 8 * scale)));
                ctx.lineTo(ventX + ventW, ventY + (v * Math.max(3, 8 * scale)));
                ctx.stroke();
            }
            ctx.lineWidth = 2;
        }

        function drawZDoor(ctx, x, y, w, fullH, scale, topFillColor, bottomFillColor) {
            var cutX = x + w / 2;
            var cutY1 = y + fullH * 0.35;
            var cutY2 = y + fullH * 0.65;
            var inset = Math.max(2, 5 * scale);

            ctx.fillStyle = topFillColor || '#e9ecef';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + w, y);
            ctx.lineTo(x + w, cutY2);
            ctx.lineTo(cutX, cutY2);
            ctx.lineTo(cutX, cutY1);
            ctx.lineTo(x, cutY1);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // shade name top half
            var _tn = getShadeNameByColor(topFillColor);
            if (_tn) { ctx.save(); ctx.font='bold 9px monospace'; ctx.fillStyle='#1c1c2e'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(_tn, x+w*0.4, y+cutY1/2-y/2); ctx.restore(); }

            ctx.fillStyle = bottomFillColor || '#e9ecef';
            ctx.beginPath();
            ctx.moveTo(x, cutY1);
            ctx.lineTo(cutX, cutY1);
            ctx.lineTo(cutX, cutY2);
            ctx.lineTo(x + w, cutY2);
            ctx.lineTo(x + w, y + fullH);
            ctx.lineTo(x, y + fullH);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x + inset, y + inset);
            ctx.lineTo(x + w - inset, y + inset);
            ctx.lineTo(x + w - inset, cutY2 - inset);
            ctx.lineTo(cutX + inset, cutY2 - inset);
            ctx.lineTo(cutX + inset, cutY1 - inset);
            ctx.lineTo(x + inset, cutY1 - inset);
            ctx.closePath();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x + inset, cutY1 + inset);
            ctx.lineTo(cutX - inset, cutY1 + inset);
            ctx.lineTo(cutX - inset, cutY2 + inset);
            ctx.lineTo(x + w - inset, cutY2 + inset);
            ctx.lineTo(x + w - inset, y + fullH - inset);
            ctx.lineTo(x + inset, y + fullH - inset);
            ctx.closePath();
            ctx.stroke();

            var knobR = Math.max(3, 4 * scale);
            var knobX = x + inset + Math.max(6, 15 * scale);
            ctx.beginPath();
            ctx.fillStyle = '#555';
            ctx.arc(knobX, y + fullH * 0.325, knobR, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(knobX, y + fullH * 0.825, knobR, 0, Math.PI * 2);
            ctx.fill();

            var ventW = Math.min(w / 3, 30 * scale);
            var ventX = x + w / 2 - ventW / 2;
            var ventStep = Math.max(3, 8 * scale);
            var ventY1 = y + inset + Math.max(5, 15 * scale);
            var ventY2 = y + fullH - inset - Math.max(5, 15 * scale) - (3 * ventStep);
            ctx.lineWidth = 1;
            for (var v = 0; v < 4; v++) {
                ctx.beginPath();
                ctx.moveTo(ventX, ventY1 + (v * ventStep));
                ctx.lineTo(ventX + ventW, ventY1 + (v * ventStep));
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(ventX, ventY2 + (v * ventStep));
                ctx.lineTo(ventX + ventW, ventY2 + (v * ventStep));
                ctx.stroke();
            }
            ctx.lineWidth = 2;
        }

        function getZDoorIndex(clickX, clickY, x, y, w, fullH) {
            var cutX = x + w / 2;
            var cutY1 = y + fullH * 0.35;
            var cutY2 = y + fullH * 0.65;

            return clickY < cutY1 ? 0 : (clickY > cutY2 ? 1 : (clickX < cutX ? 1 : 0));
        }

        function drawRequiredSheets(parts) {
            var container = document.getElementById('sheetResult');
            if (!container) return;

            container.innerHTML = '<h3 style="text-align:center; margin:8px 0;">Required Sheets</h3>';
            var groups = {};
            parts.forEach(function(part) {
                if (!groups[part.thickness]) groups[part.thickness] = [];
                groups[part.thickness].push(part);
            });
            
            var sheetCounts = {};

            Object.keys(groups).sort().forEach(function(thickness) {
                var availableSheets = getSheetsForThickness(thickness);
                var packedSheets = getRequiredSheets(groups[thickness], availableSheets);
                var planStats = getPlanStats(packedSheets);
                var thicknessTitle = document.createElement('h4');
                thicknessTitle.textContent = thickness + ' panels: ' + packedSheets.length + ' sheet(s)';
                thicknessTitle.style.margin = '10px 0 4px';
                container.appendChild(thicknessTitle);
                
                sheetCounts[thickness] = packedSheets.length;

                if (packedSheets.length === 0) {
                    var warning = document.createElement('div');
                    warning.textContent = 'Some parts do not fit available sheets.';
                    warning.style.color = '#b00020';
                    container.appendChild(warning);
                    return;
                }

                var planInfo = document.createElement('div');
                planInfo.style.fontSize = '12px';
                planInfo.style.marginBottom = '6px';
                planInfo.innerHTML = 'Total used: ' + (planStats.usedArea / 1000000).toFixed(2) +
                    ' sq.m | Total balance: ' + (planStats.wasteArea / 1000000).toFixed(2) + ' sq.m';
                container.appendChild(planInfo);

                packedSheets.forEach(function(sheet, index) {
                    var card = document.createElement('div');
                    card.className = 'sheet-card';

                    var usedArea = sheet.items.reduce(function(total, item) {
                        return total + item.finalW * item.finalH;
                    }, 0);
                    var sheetArea = sheet.stock.width * sheet.stock.height;
                    var title = document.createElement('h4');
                    title.textContent = 'Sheet ' + (index + 1) + ': ' + sheet.stock.name;
                    card.appendChild(title);

                    var info = document.createElement('div');
                    info.innerHTML = 'Thickness: ' + thickness + '<br>Used: ' + (usedArea / 1000000).toFixed(2) + ' sq.m | Balance: ' + ((sheetArea - usedArea) / 1000000).toFixed(2) + ' sq.m';
                    card.appendChild(info);

                    var canvas = document.createElement('canvas');
                    canvas.className = 'sheet-canvas';
                    canvas.width = 360;
                    canvas.height = Math.max(120, Math.round(sheet.stock.height * (canvas.width / sheet.stock.width)));
                    card.appendChild(canvas);
                    drawSheetCanvas(canvas, sheet);
                    container.appendChild(card);
                });
            });
            
            var summaryTable = document.getElementById('summaryTable');
            if (summaryTable) {
                Object.keys(sheetCounts).forEach(function(thickness) {
                    if (sheetCounts[thickness] > 0) {
                        var tr = document.createElement('tr');
                        tr.innerHTML = '<td style="border: 1px solid #ccc; padding: 6px;">HPL Sheet ' + thickness + '</td>' +
                                       '<td style="border: 1px solid #ccc; padding: 6px;">' + sheetCounts[thickness] + '</td>' +
                                       '<td style="border: 1px solid #ccc; padding: 6px;">-</td>' +
                                       '<td style="border: 1px solid #ccc; padding: 6px;">' + thickness + '</td>';
                        summaryTable.appendChild(tr);
                    }
                });
            }
        }

        function getSheetsForThickness(thickness) {
            return thickness === '3 mm' ? sheets3mm : sheets9mm;
        }

        function getRequiredSheets(parts, availableSheets) {
            var candidates = [];

            availableSheets.forEach(function(stock) {
                candidates.push(packPanels(parts, [stock]));
            });

            candidates.push(packPanels(parts, availableSheets));

            return candidates.reduce(function(best, plan) {
                if (!plan || plan.length === 0) return best;
                if (!best || isBetterSheetPlan(plan, best)) return plan;
                return best;
            }, null) || [];
        }

        function isBetterSheetPlan(nextPlan, currentPlan) {
            var next = getPlanStats(nextPlan);
            var current = getPlanStats(currentPlan);

            if (Math.abs(next.wasteArea - current.wasteArea) > 0.1) {
                return next.wasteArea < current.wasteArea;
            }
            if (next.sheetCount !== current.sheetCount) {
                return next.sheetCount < current.sheetCount;
            }
            return next.totalArea < current.totalArea;
        }

        function getPlanStats(plan) {
            return plan.reduce(function(stats, sheet) {
                var usedArea = sheet.items.reduce(function(total, item) {
                    return total + item.finalW * item.finalH;
                }, 0);
                var sheetArea = sheet.stock.width * sheet.stock.height;
                stats.usedArea += usedArea;
                stats.totalArea += sheetArea;
                stats.wasteArea += sheetArea - usedArea;
                stats.sheetCount += 1;
                return stats;
            }, {
                usedArea: 0,
                totalArea: 0,
                wasteArea: 0,
                sheetCount: 0
            });
        }

        function packPanels(parts, sheets) {
            var sortedParts = parts.slice().sort(function(a, b) {
                return (b.w * b.h) - (a.w * a.h);
            });
            var packedSheets = [];
            var sortedSheets = sheets.slice().sort(function(a, b) {
                return (a.width * a.height) - (b.width * b.height);
            });

            for (var i = 0; i < sortedParts.length; i++) {
                var placed = false;
                for (var s = 0; s < packedSheets.length; s++) {
                    if (placePanel(packedSheets[s], sortedParts[i])) {
                        placed = true;
                        break;
                    }
                }

                if (!placed) {
                    var newSheet = null;
                    for (var j = 0; j < sortedSheets.length; j++) {
                        var stock = sortedSheets[j];
                        var candidate = {
                            stock: stock,
                            items: [],
                            freeRects: [{ x: 0, y: 0, w: stock.width, h: stock.height }]
                        };
                        if (placePanel(candidate, sortedParts[i])) {
                            newSheet = candidate;
                            break;
                        }
                    }
                    if (!newSheet) return [];
                    packedSheets.push(newSheet);
                }
            }

            return packedSheets;
        }

        function placePanel(sheet, panel) {
            var best = null;
            var orientations = [
                { w: panel.w, h: panel.h, rotated: false },
                { w: panel.h, h: panel.w, rotated: true }
            ];

            orientations.forEach(function(size) {
                sheet.freeRects.forEach(function(rect) {
                    if (size.w <= rect.w && size.h <= rect.h) {
                        var waste = rect.w * rect.h - size.w * size.h;
                        if (!best || waste < best.waste) {
                            best = { rect: rect, size: size, waste: waste };
                        }
                    }
                });
            });

            if (!best) return false;

            var placed = {
                label: panel.label,
                x: best.rect.x,
                y: best.rect.y,
                finalW: best.size.w,
                finalH: best.size.h,
                rotated: best.size.rotated
            };
            sheet.items.push(placed);

            var usedRect = { x: placed.x, y: placed.y, w: placed.finalW, h: placed.finalH };
            sheet.freeRects = sheet.freeRects.flatMap(function(rect) {
                return splitRect(rect, usedRect);
            });
            sheet.freeRects = pruneRects(sheet.freeRects);
            return true;
        }

        function splitRect(rect, used) {
            if (used.x >= rect.x + rect.w || used.x + used.w <= rect.x || used.y >= rect.y + rect.h || used.y + used.h <= rect.y) {
                return [rect];
            }

            var rects = [];
            if (used.x > rect.x) rects.push({ x: rect.x, y: rect.y, w: used.x - rect.x, h: rect.h });
            if (used.x + used.w < rect.x + rect.w) rects.push({ x: used.x + used.w, y: rect.y, w: rect.x + rect.w - used.x - used.w, h: rect.h });
            if (used.y > rect.y) rects.push({ x: rect.x, y: rect.y, w: rect.w, h: used.y - rect.y });
            if (used.y + used.h < rect.y + rect.h) rects.push({ x: rect.x, y: used.y + used.h, w: rect.w, h: rect.y + rect.h - used.y - used.h });
            return rects.filter(function(next) { return next.w > 0 && next.h > 0; });
        }

        function pruneRects(rects) {
            var result = rects.slice();
            for (var i = result.length - 1; i >= 0; i--) {
                for (var j = 0; j < result.length; j++) {
                    if (i !== j && containsRect(result[j], result[i])) {
                        result.splice(i, 1);
                        break;
                    }
                }
            }
            return result;
        }

        function containsRect(a, b) {
            return a.x <= b.x && a.y <= b.y && a.x + a.w >= b.x + b.w && a.y + a.h >= b.y + b.h;
        }

        function drawSheetCanvas(canvas, sheet) {
            var ctx = canvas.getContext('2d');
            var scale = canvas.width / sheet.stock.width;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f7f7f7';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            sheet.items.forEach(function(item) {
                var x = item.x * scale;
                var y = item.y * scale;
                var w = item.finalW * scale;
                var h = item.finalH * scale;
                ctx.fillStyle = '#cfe8ff';
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = '#145ea8';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, w, h);
                if (w > 35 && h > 20) {
                    ctx.fillStyle = '#111';
                    ctx.font = '10px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(item.label, x + w / 2, y + h / 2 - 6);
                    ctx.fillText(Math.round(item.finalW) + 'x' + Math.round(item.finalH), x + w / 2, y + h / 2 + 6);
                }
            });
        }
    
        // Initialize the color palette
        color();

        // Handle canvas clicks to color individual lockers
        document.getElementById('cv').addEventListener('click', function(e) {
            var cv = document.getElementById('cv');
            var rect = cv.getBoundingClientRect();
            var clickX = e.clientX - rect.left;
            var clickY = e.clientY - rect.top;

            var lh = parseFloat(document.getElementById('lh').value);
            var lw = parseFloat(document.getElementById('lw').value);
            var lc = parseInt(document.getElementById('lc').value);
            var lr = parseInt(document.getElementById('lr').value);
            var customColumns = getCustomColumns();
            var skirting = parseFloat(document.getElementById('skirting').value) || 0;
            var zshape = document.getElementById('zshape') ? document.getElementById('zshape').checked : false;
            var zcol = document.getElementById('zcol') ? parseInt(document.getElementById('zcol').value) : 1;
            
            var padding = 50;
            var scale = Math.min((cv.width - padding * 2) / lw, (cv.height - padding * 2) / lh);

            var startX = (cv.width - (lw * scale)) / 2;
            var startY = (cv.height - (lh * scale)) / 2;
            var lockerH = Math.max(0, lh - skirting);
            var colCount = customColumns.length > 0 ? customColumns.length : lc;
            var rw = lw / colCount;
            var rh = lockerH / lr;

            if (clickX >= startX && clickX <= startX + (lw * scale) && clickY >= startY && clickY <= startY + (lockerH * scale)) {
                if (customColumns.length > 0) {
                    var col = Math.floor((clickX - startX) / (rw * scale));
                    col = Math.max(0, Math.min(customColumns.length - 1, col));
                    var isCustomZ = zshape && (zcol === 0 || col === zcol - 1);

                    if (isCustomZ) {
                        var zRow = getZDoorIndex(clickX, clickY, startX + col * rw * scale, startY, rw * scale, lockerH * scale);
                        lockerColors['custom-' + col + '-' + zRow] = currentColor;
                        calculate();
                        return;
                    }

                    var columnRows = customColumns[col];
                    var customRh = lockerH / columnRows;
                    var row = Math.floor((clickY - startY) / (customRh * scale));
                    row = Math.max(0, Math.min(columnRows - 1, row));
                    lockerColors['custom-' + col + '-' + row] = currentColor;
                    calculate();
                    return;
                }

                var c = Math.floor((clickX - startX) / (rw * scale));
                var isZ = zshape && (zcol === 0 || c === zcol - 1);
                var r;

                if (isZ) {
                    r = getZDoorIndex(clickX, clickY, startX + c * rw * scale, startY, rw * scale, lockerH * scale);
                } else {
                    r = Math.floor((clickY - startY) / (rh * scale));
                }

                lockerColors[c + '-' + r] = currentColor;
                calculate();
            }
        });
    </script>
